<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Mobile Shop</title>
</head>
<body>

<h2>Mobile Shop Management</h2>

<form action="/save" method="post">

    <input type="hidden"
           name="id"
           th:value="${phone.id}">

    Phone Name:
    <input type="text"
           name="name"
           th:value="${phone.name}">
    <br><br>

    Description:
    <input type="text"
           name="description"
           th:value="${phone.description}">
    <br><br>

    Price:
    <input type="number"
           name="price"
           th:value="${phone.price}">
    <br><br>

    <button type="submit">
        Save
    </button>

</form>

<hr>

<table border="1">

<tr>
    <th>ID</th>
    <th>Name</th>
    <th>Description</th>
    <th>Price</th>
    <th>Action</th>
</tr>

<tr th:each="p : ${phones}">

    <td th:text="${p.id}"></td>
    <td th:text="${p.name}"></td>
    <td th:text="${p.description}"></td>
    <td th:text="${p.price}"></td>

    <td>

        <a th:href="@{'/edit/' + ${p.id}}">
            Edit
        </a>

        |

        <a th:href="@{'/delete/' + ${p.id}}">
            Delete
        </a>

    </td>

</tr>

</table>

</body>
</html>
