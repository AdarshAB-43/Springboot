<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>Sign Up</title>

<script>
function validateForm(){

let password =
document.getElementById("password").value;

let confirmPassword =
document.getElementById("confirmPassword").value;

if(password !== confirmPassword){
alert("Passwords do not match");
return false;
}

return true;
}
</script>

</head>
<body>

<h2>User Registration</h2>

<form th:action="@{/signup}"
      th:object="${user}"
      method="post"
      onsubmit="return validateForm()">

Email:
<input type="email"
       th:field="*{email}" required><br><br>

Password:
<input type="password"
       id="password"
       th:field="*{password}" required><br><br>

Confirm Password:
<input type="password"
       id="confirmPassword" required><br><br>

Full Name:
<input type="text"
       th:field="*{fullName}" required><br><br>

Last Name:
<input type="text"
       th:field="*{lastName}" required><br><br>

Address:
<input type="text"
       th:field="*{address}" required><br><br>

<button type="submit">Register</button>

</form>

<a href="/">Login</a>

</body>
</html>
